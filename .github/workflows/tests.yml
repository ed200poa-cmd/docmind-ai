name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the interpreter this project is developed and deployed on.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No secrets are configured for this job on purpose. The suite must run
      # offline: no Anthropic API calls, and no embedding-model download (search
      # tests use the deterministic stub embedder in tests/conftest.py).
      - name: Run tests
        run: python -m pytest
